<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | BSc Notes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-2"></div>
    </div>

    <nav class="navbar glass">
        <div class="logo">
            <i class="ri-dashboard-line"></i>
            <span>Admin Panel</span>
        </div>
        <a href="index.html" class="btn btn-outline" style="font-size: 0.9rem;">Exit</a>
    </nav>

    <main class="container" style="margin-top: 120px;">
        <div class="admin-header">
            <h1>Leads Overview</h1>
            <button onclick="exportCSV()" class="btn btn-primary">
                <i class="ri-download-line"></i> Export CSV
            </button>
        </div>

        <div class="glass" style="padding: 20px; overflow-x: auto;">
            <table id="leads-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Semester</th>
                        <th>Subject</th>
                        <th>Note</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <!-- Populated by JS -->
                    <tr>
                        <td colspan="7" style="text-align:center; padding: 20px;">Loading leads...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin.js"></script>
</body>
</html>
